name: Avelis Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      AVELIS_ANDROID_ABI: ${{ matrix.abi }}
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build, sign and verify debug APK
        run: bash build-tools/avelis-android-hosted.sh "$AVELIS_ANDROID_ABI"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: Avelis-${{ matrix.abi }}-debug
          path: _packaging/${{ matrix.abi }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: build-logs-${{ matrix.abi }}
          path: |
            build-krita.log
            build-apk.log
          if-no-files-found: ignore
