name: Android native checkpoint
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    runs-on: [self-hosted, linux, x64, avelis-kde-android]
    timeout-minutes: 180
    env:
      AVELIS_ANDROID_ABI: ${{ matrix.abi }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and package
        run: bash build-tools/avelis-android.sh "$AVELIS_ANDROID_ABI"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-${{ matrix.abi }}-debug
          path: |
            build-krita.log
            build-apk.log
            _packaging/${{ matrix.abi }}/*.apk
            _packaging/${{ matrix.abi }}/*.sha256
          if-no-files-found: warn
